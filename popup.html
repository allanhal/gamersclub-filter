<!DOCTYPE html>
<html>
  <head>
    <link
      rel="stylesheet"
      href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css"
      integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm"
      crossorigin="anonymous"
    />
    <link rel="preconnect" href="https://fonts.gstatic.com" />
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@200&display=swap" rel="stylesheet" />
    <style>
      html,
      body {
        font-family: 'Oswald', sans-serif;
        margin: 0;
        height: 4rem;
        padding: 0;
        width: 20rem;
      }

      h1 {
        font-size: 2rem;
        font-weight: 400;
        margin: 0;
        color: #2f5876;
      }

      h2 {
        font-size: 1rem;
        font-weight: 200;
        margin: 0;
        color: #2f5876;
      }

      img {
        width: 2rem;
      }

      .modal-header {
        border: 0;
        align-items: center;
        justify-content: space-between;
      }

      .modal-content {
        padding: 1rem;
        display: flex;
        flex-direction: row;
        border: 0;
        align-items: center;
        justify-content: space-between;
      }
    </style>
  </head>

  <body>
    <div class="modal-header">
      <img src="icon_256.png" alt="icon" />
      <h1>Diego Filter</h1>
      <h2>(1.0.0)</h2>
    </div>
    <div class="modal-content">
      <div style="width: 100%">
        <div style="width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 20px; margin-bottom: 20px">
          <span style="width: auto">Filtrar elementos</span>

          <div id="filter-text" style="display: flex; align-items: center; justify-content: center; padding: none; margin: none">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              class="lucide lucide-circle-plus-icon lucide-circle-plus"
            >
              <circle cx="12" cy="12" r="10" />
              <path d="M8 12h8" />
              <path d="M12 8v8" />
            </svg>
          </div>
        </div>
        <div style="width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 20px; margin-bottom: 20px">
          <span style="width: auto">Filtrando itens com t&iacute;tulo:</span>

          <div id="add-text" style="display: flex; align-items: center; justify-content: center; padding: none; margin: none">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              class="lucide lucide-circle-plus-icon lucide-circle-plus"
            >
              <circle cx="12" cy="12" r="10" />
              <path d="M8 12h8" />
              <path d="M12 8v8" />
            </svg>
          </div>
        </div>
        <div id="text-list" style="width: 100%; display: flex; flex-direction: column; gap: 10px">
            
        </div>
        </div>
      </div>
    </div>

    <script type="text/javascript" src="popup.js"></script>
  </body>
</html>
